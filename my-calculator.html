<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles/my-calculator.css">
</head>
<body>
    <div class="container">

        <p class="js-numbers"></p>
        <p>
            <button class="js-num" onclick="
                updateCalculation('1')   
            ">1</button>
    
            <button class="js-num" onclick="
                updateCalculation('2')
            ">2</button>
    
            <button class="js-num" onclick="
                updateCalculation('3')
            ">3</button>
    
            <button class='js-znak' onclick="
                updateCalculation(' + ')
            ">+</button>
        </p>
    
        <p>
            <button class="js-num" onclick="
                updateCalculation('4')
                ">4</button>
    
            <button class="js-num" onclick="
                updateCalculation('5')
                ">5</button>
    
            <button class="js-num" onclick="
                updateCalculation('6')
                ">6</button>
    
            <button class='js-znak' onclick="
                updateCalculation(' - ')
            ">-</button>
        </p>
    
        <p>
            <button class="js-num" onclick="
                updateCalculation('7')
                ">7</button>
    
            <button class="js-num" onclick="
                updateCalculation('8')
                ">8</button>
    
            <button class="js-num" onclick="
                updateCalculation('9')
                ">9</button>
    
            <button class='js-znak' onclick="
                updateCalculation(' * ')
            ">*</button>
        </p>
    
        <p>
            <button class="js-num" onclick="
                updateCalculation('0')
                ">0</button>
    
            <button class="js-num" onclick="
                updateCalculation('.')
                ">.</button>
    
            <button class="js-num" onclick="
                calculation = eval(calculation);
                document.querySelector('.js-numbers').innerHTML = calculation
                localStorage.setItem('calculation', calculation)
            ">=</button>
    
            <button class='js-znak' onclick="
            updateCalculation(' / ')
            ">/</button>
        </p>
    
        <p>
            <button class="js-clear" onclick="
                calculation = '';
                localStorage.removeItem(calculation)
                document.querySelector('.js-numbers').innerHTML = ''
            ">Clear</button>
        </p>
    </div>

    <p class="My-name">Made by Bayramaliyev Gurban</p>
    <script src="scripts/my-calculator.js"></script>
</body>
</html>
